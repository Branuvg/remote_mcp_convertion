[project]
name = "remote-mcp-convertion"
version = "0.1.0"
description = "Remote MCP server for deterministic text encoding/decoding (binary, hex, Morse) — CC3067 Redes Project 1"
authors = [
    { name = "Gabriel Bran", email = "gabrielbranb@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "starlette>=0.40.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
